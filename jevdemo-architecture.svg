<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="aOrange" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f97316"/></marker>
    <marker id="aSky" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0ea5e9"/></marker>
    <marker id="aPurple" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
  <style>
    .flow-line-orange { stroke-dasharray: 8,4; animation: dfo .5s linear infinite; }
    @keyframes dfo { to { stroke-dashoffset: -12; } }
    .flow-line-sky { stroke-dasharray: 8,4; animation: dfs .5s linear infinite; }
    @keyframes dfs { to { stroke-dashoffset: -12; } }
    .flow-line-purple { stroke-dasharray: 8,4; animation: dfp .5s linear infinite; }
    @keyframes dfp { to { stroke-dashoffset: -12; } }
  </style>

  <rect width="1360" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="680" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Jev 最佳实践 Demo 架构图</text>
  <text x="680" y="72" text-anchor="middle" font-size="13" fill="#6b7280">TypeSafe System One · @typesafe-ai/sdk · TypeScript</text>

  <!-- Card 1: State -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="12" fill="url(#gGreen)"/>
    <rect x="0" y="20" width="280" height="15" fill="url(#gGreen)"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">src/state · 状态准备</text>
    <text x="16" y="62" font-size="12.5" fill="#1f2937">01 · 对象 vs 字符串</text>
    <text x="16" y="88" font-size="12.5" fill="#1f2937">02 · 对话 {speaker, text} 数组</text>
    <text x="16" y="114" font-size="12.5" fill="#1f2937">03 · 预计算日期 / 查找</text>
    <text x="16" y="140" font-size="12.5" fill="#1f2937">04 · 只给相关信息，省 tokens</text>
  </g>

  <!-- Card 2: Questions -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="12" fill="url(#gOrange)"/>
    <rect x="0" y="20" width="280" height="15" fill="url(#gOrange)"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">src/questions · 问题编写</text>
    <text x="16" y="62" font-size="12.5" fill="#1f2937">01 · noul vs choice 选型 + other</text>
    <text x="16" y="88" font-size="12.5" fill="#1f2937">02 · 程度用 score + 等级描述</text>
    <text x="16" y="114" font-size="12.5" fill="#1f2937">03 · 拆分复合判断</text>
    <text x="16" y="140" font-size="12.5" fill="#1f2937">04 · criteria 明确边界</text>
    <text x="16" y="166" font-size="12.5" fill="#1f2937">05 · 同 state 批量一次请求</text>
  </g>

  <!-- Card 3: Jev API -->
  <g transform="translate(720, 120)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="#f1f5f9" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="12" fill="url(#gSky)"/>
    <rect x="0" y="20" width="280" height="15" fill="url(#gSky)"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Jev API · 云端判断</text>
    <text x="16" y="62" font-size="12.5" fill="#1f2937">@typesafe-ai/sdk</text>
    <text x="16" y="88" font-size="12.5" fill="#1f2937">TypeSafeClient · systemOne()</text>
    <text x="16" y="114" font-size="12.5" fill="#1f2937">{ state, questions }</text>
    <text x="16" y="140" font-size="12.5" fill="#1f2937">noul / choice / score</text>
    <text x="16" y="166" font-size="12.5" fill="#1f2937">typed answers + usage</text>
  </g>

  <!-- Card 4: Answers -->
  <g transform="translate(1060, 120)">
    <rect x="0" y="0" width="280" height="190" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="12" fill="url(#gPurple)"/>
    <rect x="0" y="20" width="280" height="15" fill="url(#gPurple)"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">src/answers · 答案使用</text>
    <text x="16" y="62" font-size="12.5" fill="#1f2937">01 · 意图路由（判读归 Jev）</text>
    <text x="16" y="88" font-size="12.5" fill="#1f2937">02 · confidence 三档门控</text>
    <text x="16" y="114" font-size="12.5" fill="#1f2937">03 · 按动作分阈值 0.5 / 0.95</text>
    <text x="16" y="140" font-size="12.5" fill="#1f2937">04 · 组合评分，权重在代码</text>
  </g>

  <!-- Flow arrows -->
  <path d="M322 215 L376 215" stroke="#ffedd5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M322 215 L374 215" class="flow-line-orange" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#aOrange)" stroke-linecap="round"/>
  <path d="M662 215 L716 215" stroke="#e0f2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M662 215 L714 215" class="flow-line-sky" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#aSky)" stroke-linecap="round"/>
  <path d="M1002 215 L1056 215" stroke="#f3e8ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M1002 215 L1054 215" class="flow-line-purple" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#aPurple)" stroke-linecap="round"/>

  <!-- lib card + connectors -->
  <path d="M280 400 L180 312" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M420 400 L520 312" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <g transform="translate(210, 400)">
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="12" fill="url(#gBlue)"/>
    <rect x="0" y="20" width="280" height="15" fill="url(#gBlue)"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">src/lib · 公共层</text>
    <text x="16" y="60" font-size="12.5" fill="#1f2937">client.ts · TYPESAFE_API_KEY 走环境变量</text>
    <text x="16" y="84" font-size="12.5" fill="#1f2937">show.ts · 统一打印答案与 token 用量</text>
  </g>

  <!-- Process description -->
  <text x="40" y="545" font-size="13" font-weight="bold" fill="#111827">流程 Process</text>
  <text x="40" y="566" font-size="12" fill="#374151">① 代码准备 state：能算的先算好，只给相关信息</text>
  <text x="40" y="584" font-size="12" fill="#374151">② 组装 questions：noul 问真假 · choice 选一个 · score 打程度</text>
  <text x="40" y="602" font-size="12" fill="#374151">③ 互不依赖的问题合并一次请求，并行返回</text>
  <text x="40" y="620" font-size="12" fill="#374151">④ 按置信度 / 概率分档：直接执行 · 确认 · 转人工</text>
  <text x="40" y="638" font-size="12" fill="#374151">⑤ 权重与策略在代码里调，无需重新提问</text>

  <!-- Legend -->
  <text x="1080" y="545" font-size="13" font-weight="bold" fill="#111827">图例 Legend</text>
  <rect x="1080" y="556" width="14" height="14" rx="3" fill="#22c55e"/><text x="1102" y="568" font-size="12" fill="#374151">State 数据准备</text>
  <rect x="1080" y="578" width="14" height="14" rx="3" fill="#f97316"/><text x="1102" y="590" font-size="12" fill="#374151">Questions 问题编写</text>
  <rect x="1080" y="600" width="14" height="14" rx="3" fill="#0ea5e9"/><text x="1102" y="612" font-size="12" fill="#374151">Jev API 云端判断</text>
  <rect x="1080" y="622" width="14" height="14" rx="3" fill="#a855f7"/><text x="1102" y="634" font-size="12" fill="#374151">Answers 答案使用</text>
</svg>
